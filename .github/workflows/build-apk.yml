name: Build Coin Push Radar APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Setup Signing Keystore
        run: |
          mkdir -p keystore
          if [ ! -f keystore/release.keystore ]; then
            keytool -genkeypair -v \
              -keystore keystore/release.keystore \
              -alias coinpush \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass coinpush \
              -keypass coinpush \
              -dname "CN=CoinPush,OU=Trading,O=CoinPushRadar,C=US"
          fi

      - name: Build Release APK with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/CoinPushRadar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoinPushRadar-APK
          path: output/CoinPushRadar.apk

      - name: Create Release & Attach APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.9.8
          name: Coin Push Radar v1.9.8
          body: |
            ### 🚀 Coin Push Radar v1.9.8 (Bybit Linear Perpetual Upgrade)
            - **Bybit Linear Futures (v5 API):** 829+ live USDT linear pairs including all popular meme coins (1000PEPE, 1000BONK, WIF, POPCAT, GOAT, ACT, PNUT, MOODENG, HYPE, SUI, DOGE).
            - **In-App Interactive Candlestick Charts (Zero Redirects):** Live TradingView Bybit candlestick charts with 1s, 1m, 5m, 15m, 1h, 4h, 1d timeframes fully embedded inside the app.
            - **On-Screen Popups & Heads-Up Alerts:** Instant visual alert card sliding down when breakout momentum triggers, plus Android system heads-up notifications with sound and vibration.
            - **Settings Test Alert Button:** Test notification delivery and on-screen popups with 1 tap.
            - **100% Unrestricted VIP:** Master Activate All toggle active for all 829+ pairs, no 3-coin cap, and zero ads.
          files: output/CoinPushRadar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
